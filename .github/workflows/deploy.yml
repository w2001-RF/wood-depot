name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # project site lives at /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # optional business config: Settings → Secrets and variables → Actions → Variables
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_BUSINESS_NAME: ${{ vars.VITE_BUSINESS_NAME }}
          VITE_BUSINESS_PHONE: ${{ vars.VITE_BUSINESS_PHONE }}
          VITE_LATITUDE: ${{ vars.VITE_LATITUDE }}
          VITE_LONGITUDE: ${{ vars.VITE_LONGITUDE }}
          VITE_SEASONAL_MODE: ${{ vars.VITE_SEASONAL_MODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
